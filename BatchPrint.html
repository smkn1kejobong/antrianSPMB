<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batch Print Antrian</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      line-height: 1.3;
      color: #1e293b;
      background-color: #f0f4f8;
      font-size: 12px;
    }

    .toolbar {
      max-width: 1100px;
      margin: 0 auto 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .toolbar h1 {
      margin: 0;
      font-size: 22px;
      color: #1e40af;
    }

    .toolbar p {
      margin: 4px 0 0;
      color: #64748b;
    }

    .btn-print {
      border: none;
      background: #2563eb;
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }

    .list-container {
      max-width: 1100px;
      margin: 0 auto 18px;
      background: #fff;
      border: 1px solid #dbe3ec;
      border-radius: 10px;
      overflow: hidden;
    }

    .list-header {
      display: grid;
      grid-template-columns:
        60px
        140px
        1fr
        1fr
        120px
        140px
        170px;

      gap: 10px;
      padding: 12px 16px;
      background: #eff6ff;
      border-bottom: 1px solid #dbe3ec;
      font-weight: 700;
      color: #1e3a8a;
      font-size: 12px;
    }

    .list-row {
      display: grid;
      grid-template-columns:
        60px
        140px
        1fr
        1fr
        120px
        140px
        170px;

      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid #eef2f7;
      align-items: center;
      font-size: 12px;
    }

    .list-row:hover {
      background: #f8fafc;
    }

    .action-group {
      display: flex;
      gap: 8px;
    }

    .btn-small {
      border: none;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }

    .btn-view {
      background: #0f172a;
      color: #fff;
    }

    .btn-item-print {
      background: #2563eb;
      color: #fff;
    }

    .pagination-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-top: 1px solid #dbe3ec;
      background: #fff;
    }

    .pagination-summary {
      color: #64748b;
      font-size: 11px;
      font-weight: 600;
    }

    .pagination-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pagination-btn {
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #1e293b;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }

    .pagination-btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    #printContainer {
      max-width: 900px;
      margin: 0 auto;
    }

    .print-page {
      margin-bottom: 18px;
    }

    .print-logo-header {
      text-align: center;
      margin-bottom: 10px;
    }

    .print-logo-header .logo-img {
      width: 65px;
      margin-bottom: 5px;
    }

    .main-border-box {
      border: 2px solid #000;
      padding: 0;
      margin-bottom: 10px;
      background: #fff;
    }

    .title-area {
      text-align: center;
      font-weight: 700;
      font-size: 12.5px;
      padding: 10px;
      border-bottom: 2px solid #000;
      text-transform: uppercase;
      line-height: 1.4;
      color: #000;
    }

    .section-title {
      font-weight: 700;
      padding: 5px 10px;
      font-size: 11px;
      border-bottom: 1px solid #000;
      background-color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #000;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table td {
      border-bottom: 1px solid #000;
      padding: 4px 8px;
      font-size: 10.5px;
      height: 23px;
      box-sizing: border-box;
      vertical-align: middle;
      color: #000;
    }

    .lbl-left {
      text-align: right;
      font-weight: 700;
      width: 38%;
      padding-right: 12px !important;
    }

    .colon-center {
      text-align: center;
      width: 3%;
      padding: 0 !important;
      font-weight: 700;
    }

    .val-right {
      text-align: left;
      width: 59%;
    }

    .box-foto-container {
      border-left: 1px solid #000;
      text-align: center;
      vertical-align: middle !important;
      background: #fff;
      padding: 6px !important;
    }

    .photo-frame {
      border: 1px dashed #000;
      width: 115px;
      height: 172px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      margin: auto;
    }

    .text-foto-warna {
      color: #1e40af;
      font-weight: 700;
      font-size: 10px;
      line-height: 1.3;
      text-transform: uppercase;
      display: block;
    }

    .antrian-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      vertical-align: middle;
    }

    .box-part {
      border: 1px solid #000;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      border-radius: 4px;
      line-height: 1.2;
      display: inline-block;
    }

    .box-op {
      background: #eff6ff;
      color: #1e40af;
    }

    .box-no {
      background: #eff6ff;
      color: #2563eb;
    }

    .box-hari {
      background: #ffffff;
      color: #000000;
    }

    .ceklis-table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0;
    }

    .ceklis-table th,
    .ceklis-table td {
      border: 1px solid #000;
      padding: 3px 5px;
      font-size: 10px;
      vertical-align: middle;
      color: #000;
      line-height: 1.2;
    }

    .ceklis-table th {
      background-color: #f1f5f9;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      padding: 5px 3px;
    }

    .center-text {
      text-align: center;
    }

    .note-text {
      font-size: 9.5px;
      font-style: italic;
      margin-top: 6px;
      line-height: 1.3;
      color: #334155;
    }

    .ttd-grid {
      width: 100%;
      margin-top: 12px;
      border-collapse: collapse;
    }

    .ttd-grid td {
      width: 50%;
      text-align: center;
      padding: 4px 0;
      font-size: 10.5px;
      vertical-align: top;
      color: #000;
      line-height: 1.3;
    }

    .ttd-space {
      height: 38px;
    }

    .footer-pdf {
      text-align: center;
      margin-top: 20px;
      font-weight: 700;
      border-top: 1px dashed #000;
      padding-top: 6px;
      font-size: 10.5px;
      color: #000;
    }

    .empty-state {
      padding: 24px;
      text-align: center;
      color: #64748b;
      background: #fff;
      border-radius: 10px;
      margin: 0 auto;
      max-width: 900px;
      border: 1px solid #d0dbe5;
    }

    @media print {

      @page {
        size: 215mm 330mm;
        margin: 0.4cm 0.5cm;
      }

      body {
        background-color: #fff;
        padding: 0;
        margin: 0;
      }

      body * {
        visibility: hidden;
      }

      #printContainer,
      #printContainer * {
        visibility: visible;
      }

      #printContainer {
        display: none;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 0;
      }

      .toolbar,
      .list-container {
        display: none !important;
      }

      .print-page {
        page-break-after: always;
      }

      .print-page:last-child {
        page-break-after: auto;
      }

      .box-op,
      .box-no {
        background: #fff !important;
      }

      .photo-frame {
        background: #fff !important;
      }

      .ceklis-table th {
        background-color: #eaeaea !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>

<body>

  <div class="toolbar">
    <div>
      <h1>Batch Print Antrian</h1>
      <p>Daftar seluruh antrian yang sudah tercatat.</p>
    </div>

    <button
      class="btn-print"
      onclick="printAll()">
      Cetak Semua
    </button>
  </div>

  <div
    id="listContainer"
    class="list-container">
  </div>

  <div id="printContainer"></div>

  <script>

    const berkasJateng = [
      "Asli Buku Rapor SMP/sederajat.",
      "Asli Surat Keterangan Nilai Rapor Semester 1 sampai Semester 5.",
      "Asli Sertifikat Hasil Tes Kemampuan Akademik.",
      "Asli Ijazah / SKL.",
      "Asli Akta Kelahiran.",
      "Asli Kartu Keluarga.",
      "Asli surat penugasan.",
      "Asli Surat Pernyataan Kepala Sekolah.",
      "Asli Surat Keterangan Domisili.",
      "Asli piagam prestasi.",
      "Asli Surat Keterangan Ketua OSIS.",
      "Asli Surat Keterangan Sehat."
    ];

    let globalRows = [];
    let currentPage = 1;
    const rowsPerPage = 10;

    function escapeHtml(text) {

      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

    }

    function buildRows(rows) {

      globalRows = Array.isArray(rows) ? rows : [];
      currentPage = 1;

      if (globalRows.length === 0) {

        document.getElementById('listContainer').innerHTML = '';

        document.getElementById('printContainer').innerHTML =
          '<div class="empty-state">Belum ada data antrian.</div>';

        return;
      }

      renderList(globalRows);

      document.getElementById('printContainer').innerHTML = '';

    }

    function renderList(rows) {

      const totalRows = rows.length;
      const totalPages = Math.max(Math.ceil(totalRows / rowsPerPage), 1);

      if (currentPage > totalPages) {
        currentPage = totalPages;
      }

      const startIndex = (currentPage - 1) * rowsPerPage;
      const pageRows = rows.slice(startIndex, startIndex + rowsPerPage);

      let html = `
        <div class="pagination-controls">
          <div class="pagination-summary">
            Menampilkan ${startIndex + 1} - ${Math.min(startIndex + pageRows.length, totalRows)} dari ${totalRows} data
          </div>

          <div class="pagination-buttons">
            <button
              class="pagination-btn"
              ${currentPage === 1 ? 'disabled' : ''}
              onclick="goToPage(${currentPage - 1})">
              Sebelumnya
            </button>

            <div class="pagination-summary">
              Halaman ${currentPage} / ${totalPages}
            </div>

            <button
              class="pagination-btn"
              ${currentPage === totalPages ? 'disabled' : ''}
              onclick="goToPage(${currentPage + 1})">
              Berikutnya
            </button>
          </div>
        </div>

        <div class="list-header">
          <div>NO</div>
          <div>NISN</div>
          <div>NAMA</div>
          <div>ASAL SEKOLAH</div>
          <div>NOMOR</div>
          <div>LOKET</div>
          <div>AKSI</div>
        </div>
      `;

      pageRows.forEach(function(row, index) {

        const globalIndex = startIndex + index;

        html += `
          <div class="list-row">

            <div>${globalIndex + 1}</div>

            <div>${escapeHtml(row.nisn)}</div>

            <div>${escapeHtml(row.nama)}</div>

            <div>${escapeHtml(row.asal)}</div>

            <div>${escapeHtml(row.nomor)}</div>

            <div>${escapeHtml(row.loket)}</div>

            <div class="action-group">

              <button
                class="btn-small btn-view"
                onclick="previewSingle(${globalIndex})">

                Preview

              </button>

              <button
                class="btn-small btn-item-print"
                onclick="printSingle(${globalIndex})">

                Cetak

              </button>

            </div>

          </div>
        `;
      });

      document.getElementById('listContainer').innerHTML = html;

    }

    function goToPage(page) {

      const totalPages = Math.max(Math.ceil(globalRows.length / rowsPerPage), 1);
      currentPage = Math.min(Math.max(1, page), totalPages);
      renderList(globalRows);

    }

    function previewSingle(index) {

      const row = globalRows[index];

      openPrintWindow([row], false);

    }

    function printSingle(index) {

      const row = globalRows[index];

      openPrintWindow([row], true);

    }

    function printAll() {

      openPrintWindow(globalRows, true);

    }

    function sanitizePopupStyles() {

      return Array.from(document.querySelectorAll('style'))
        .map(function(style) {

          return style.textContent || '';

        })
        .map(function(css) {

          return css.replace(/@media\s+print\s*\{[\s\S]*?\}\s*/g, '');

        })
        .join('\n');

    }

    function openPrintWindow(rows, autoPrint) {

      const popup = window.open('', '_blank', 'width=1000,height=800');

      if (!popup) {

        alert('Popup diblokir. Izinkan popup untuk membuka halaman cetak.');
        return;
      }

      const popupStyles = sanitizePopupStyles();
      const printHtml = renderPrint(rows);
      const popupContent = `<div id="printContainer">${printHtml}</div>`;

      popup.document.write(`
        <!DOCTYPE html>
        <html lang="id">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Preview Cetak Antrian</title>
          <style>
            ${popupStyles}

            body {
              visibility: visible !important;
            }

            #printContainer {
              display: block !important;
              visibility: visible !important;
            }
          </style>
        </head>
        <body>
          ${popupContent}
          <script>
            window.onload = function() {
              setTimeout(function() {
                ${autoPrint ? 'window.print();' : ''}
              }, 300);
            };
          <\/script>
        </body>
        </html>
      `);

      popup.document.close();
      popup.focus();

    }

    function renderPrint(rows) {

      var html = rows.map(function(row) {

        var berkasRows = berkasJateng.map(function(item, itemIndex) {

          return `
            <tr>
              <td class="center-text">
                <b>${itemIndex + 1}</b>
              </td>

              <td>${escapeHtml(item)}</td>

              <td></td>
              <td></td>
              <td></td>
            </tr>
          `;

        }).join('');

        return `

          <section class="print-page">

            <div class="print-logo-header">

              <img
                src="LOGO_SEKOLAH.png"
                class="logo-img">

            </div>

            <div class="main-border-box">

              <div class="title-area">

                DAFTAR VERIFIKASI KELENGKAPAN DOKUMEN/BERKAS
                SPMB SMA NEGERI/SMK NEGERI
                <br>

                PROVINSI JAWA TENGAH
                <br>

                TAHUN 2026

              </div>

              <div class="section-title">
                A. DATA CALON MURID
              </div>

              <table class="data-table">

                <tr>

                  <td class="lbl-left">
                    LOKASI VERIFIKASI
                  </td>

                  <td class="colon-center">:</td>

                  <td class="val-right">
                    <b><?= namaSekolah ?></b>
                  </td>

                  <td
                    rowspan="9"
                    class="box-foto-container"
                    width="135">

                    <div class="photo-frame">

                      <span class="text-foto-warna">
                        PAS FOTO<br>4 x 6
                      </span>

                    </div>

                  </td>

                </tr>

                <tr>

                  <td class="lbl-left">
                    NAMA CALON MURID BARU
                  </td>

                  <td class="colon-center">:</td>

                  <td class="val-right">
                    <b>${escapeHtml(row.nama)}</b>
                  </td>

                </tr>

                <tr>

                  <td class="lbl-left">
                    NISN
                  </td>

                  <td class="colon-center">:</td>

                  <td class="val-right">
                    ${escapeHtml(row.nisn)}
                  </td>

                </tr>

                <tr>

                  <td class="lbl-left">
                    NOMOR HP / WA
                  </td>

                  <td class="colon-center">:</td>

                  <td class="val-right">
                    ${escapeHtml(row.no_hp)}
                  </td>

                </tr>

                <tr>

                  <td class="lbl-left">
                    ASAL SEKOLAH
                  </td>

                  <td class="colon-center">:</td>

                  <td class="val-right">
                    ${escapeHtml(row.asal)}
                  </td>

                </tr>

                <tr>

                  <td class="lbl-left">
                    NOMOR ANTRIAN
                  </td>

                  <td class="colon-center">:</td>

                  <td class="val-right">

                    <div class="antrian-wrapper">

                      <span class="box-part box-op">
                        ${escapeHtml(row.loket)}
                      </span>

                      <span class="box-part box-no">
                        NOMOR ${escapeHtml(row.nomor)}
                      </span>

                      <span class="box-part box-hari">
                        ${escapeHtml(row.hari)}
                      </span>

                    </div>

                  </td>

                </tr>

                <tr>

                  <td class="lbl-left">
                    SESI
                  </td>

                  <td class="colon-center">:</td>

                  <td class="val-right">
                    <b>${escapeHtml(row.sesi)}</b>
                  </td>

                </tr>

              </table>

            </div>

            <div
              class="section-title"
              style="
                border: 2px solid #000;
                border-bottom:1px solid #000;
                margin-bottom:0;">

              B. DOKUMEN/BERKAS

            </div>

            <table
              class="ceklis-table"
              style="
                margin-top:0;
                border: 2px solid #000;
                border-top:none;">

              <thead>

                <tr>

                  <th width="4%">NO</th>

                  <th width="66%">
                    NAMA DOKUMEN/BERKAS
                  </th>

                  <th width="9%">
                    FOTO COPY
                  </th>

                  <th width="9%">
                    BERKAS ASLI
                  </th>

                  <th width="12%">
                    KETERANGAN
                  </th>

                </tr>

              </thead>

              <tbody>
                ${berkasRows}
              </tbody>

            </table>
          <div class="note-text">
          Demikian Dokumen/Berkas SPMB SMA Negeri dan SMK Negeri yang telah diperiksa dan teliti sesuai dengan aslinya oleh Tim Verifikasi, Orang Tua/Wali, Calon Peserta Didik dan Ketua Panitia SPMB Tingkat Sekolah.<br>
          Apabila di kemudian hari ditemukan dan atau terdapat Dokumen yang tidak sesuai, sepenuhnya menjadi tanggungjawab Orang Tua Wali dan Calon Murid Baru.<br>
          <b>Dokumen ini dicetak 2 (dua) rangkap. 1 (satu) untuk orang tua/wali, 1 untuk arsip Sekolah.</b>
          </div>
          <table class="ttd-grid">
          <tr>
          <td>Orang Tua/Wali,<br><div class="ttd-space"></div>( ............................................ )</td>
          <td> ${escapeHtml(row.hari)} <br>Calon Murid,<br><div class="ttd-space"></div>( <b> ${escapeHtml(row.nama)} </b> )</td>
          </tr>
          <tr>
          <td>Mengetahui,<br>Ketua Panitia<br><div class="ttd-space"></div>( <b>________________________ </b>)<br>NIP.-</td>
          <td><br>Verifikator,<br><div class="ttd-space"></div>( ________________________ )</td>
          </tr>
          </table>

            <div class="footer-pdf">
              <?= footerTeks ?>
            </div>

          </section>
        `;

      }).join('');

      return html;

    }

    google.script.run

      .withSuccessHandler(function(data) {

        buildRows(
          Array.isArray(data)
            ? data
            : []
        );

      })

      .withFailureHandler(function(err) {

        console.error(err);

        document.getElementById('printContainer').innerHTML =
          '<div class="empty-state">Gagal memuat data.</div>';

      })

      .getBatchPrintData();

  </script>

</body>
</html>
